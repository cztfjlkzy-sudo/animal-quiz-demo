<section id="intro"><span class="eyebrow">双面动物人格 · 4题试玩</span><h1>两面都算数</h1><p>聚会里的你，和回家以后的你，分别像哪只动物？</p>
<div class="pair"><article class="card"><small>社交时</small><div class="art" data-art="dog" aria-hidden="true"></div><h3>小狗</h3></article><article class="card solo"><small>独处时</small><div class="art" data-art="capybara" aria-hidden="true"></div><h3>水豚</h3></article></div>
<p class="muted lines">图中是一个组合示例。选出你更可能做的事，看看自己的组合。</p><button id="start" class="primary">开始试玩</button></section>

<section id="result" hidden><span class="eyebrow">我的双面动物卡 · 试玩结果</span><h2 id="result-title" class="resultTitle" tabindex="-1"></h2><div id="cards" class="pair"></div><div id="reason"></div><p class="lines muted" id="tie"></p><p class="muted lines" style="margin-top:15px">可以截图留下这张卡，也可以让朋友猜猜你的组合。</p><button id="restart" class="primary">再玩一次</button></section>

<script>
(function (root) {
  'use strict';
  var roleMaps = {
    social: { '++': 'dog', '+-': 'fox', '-+': 'deer', '--': 'owl' },
    solo: { '++': 'squirrel', '+-': 'otter', '-+': 'cat', '--': 'capybara' }
  };
  function compute(section, answers, kind) {
    if (!roleMaps[kind] || answers.length !== section.questions.length) throw new Error('答题数量不完整');
    var chosen = section.questions.map(function (q, i) {
      if (!Number.isInteger(answers[i]) || !q.options[answers[i]]) throw new Error('请完成全部题目');
      return { question: q.text, option: q.options[answers[i]], index: i };
    });
    var scores = { x: 0, y: 0 }, limits = { x: 0, y: 0 };
    ['x', 'y'].forEach(function (axis) {
      scores[axis] = chosen.reduce(function (s, c) { return s + c.option[axis]; }, 0);
      limits[axis] = section.questions.reduce(function (s, q) {
        return s + Math.max.apply(null, q.options.map(function (o) { return Math.abs(o[axis]); }));
      }, 0);
    });
    // Exact ties use the first response on that axis; never randomise a result.
    var signs = {};
    ['x', 'y'].forEach(function (axis) {
      signs[axis] = Math.sign(scores[axis]) || Math.sign(chosen[0].option[axis]);
    });
    var key = (signs.x > 0 ? '+' : '-') + (signs.y > 0 ? '+' : '-');
    var evidence = chosen.slice().sort(function (a, b) {
      var as = a.option.x * signs.x + a.option.y * signs.y;
      var bs = b.option.x * signs.x + b.option.y * signs.y;
      return bs - as || a.index - b.index;
    }).slice(0, 2);
    return {
      animal: roleMaps[kind][key], scores: scores, limits: limits,
      close: ['x', 'y'].filter(function (a) { return Math.abs(scores[a]) / limits[a] <= 0.25; }),
      tied: ['x', 'y'].filter(function (a) { return scores[a] === 0; }),
      evidence: evidence
    };
  }
  function exampleAnswers(section, x, y) {
    return section.questions.map(function (q) {
      return q.options.findIndex(function (o) { return Math.sign(o.x) === x && Math.sign(o.y) === y; });
    });
  }
  var api = { compute: compute, exampleAnswers: exampleAnswers };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.QuizCore = api;
